<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - Cloud Lab 1</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 60px auto;
        }

        .profile {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .info {
            margin-bottom: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .label {
            font-weight: bold;
            display: inline-block;
            width: 150px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">

            <h1>Thông tin sinh viên</h1>

            <p class="subtitle">
                Cloud Computing - LAB 1: Git & GitHub
            </p>

            <div class="info">
                <span class="label">Họ và tên:</span>
                Đào Công Khả
            </div>

            <div class="info">
                <span class="label">Mã sinh viên:</span>
                NHẬP_MÃ_SINH_VIÊN
            </div>

            <div class="info">
                <span class="label">Lớp:</span>
                KTCN-CNTT-23
            </div>

            <div class="info">
                <span class="label">Môn học:</span>
                Điện toán đám mây
            </div>

            <div class="info">
                <span class="label">Bài thực hành:</span>
                LAB 1 - Git Basics
            </div>

            <div class="footer">
                Cloud Computing Lab 1
            </div>

        </div>

    </div>

</body>
</html>
